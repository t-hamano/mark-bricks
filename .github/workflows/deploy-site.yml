name: Build and Deploy Site to GitHub Pages

on:
    push:
        branches:
            - main
        paths:
            - 'apps/site/**'
            - 'storybook/**'
            - 'packages/**'
            - 'README.md'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.nvmrc'
            - '.github/scripts/publish-gh-pages.mjs'
            - '.github/workflows/deploy-site.yml'
    pull_request:
        paths:
            - 'apps/site/**'
            - 'packages/**'
            - 'README.md'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.nvmrc'
            - '.github/workflows/deploy-site.yml'
    workflow_dispatch:

# Disable permissions for all scopes by default; grant per job below.
permissions: {}

# PR validation does not hold up production deployments. Never cancel a
# deployment that has already started.
concurrency:
    group: pages-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build site
              run: pnpm build:site

            # Visual Regression Test already builds Storybook for PRs.
            - name: Build Storybook
              if: github.event_name != 'pull_request'
              run: pnpm build-storybook

            - name: Assemble Pages artifact
              if: github.event_name != 'pull_request'
              run: node apps/site/scripts/assemble-pages.mjs

            - name: Upload site
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site
                  path: apps/site/dist
                  include-hidden-files: true
                  retention-days: 1

    # GitHub Pages serves the gh-pages branch, which also holds the PR
    # Storybook previews from the Storybook Preview workflow.
    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts

            - name: Download site
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site
                  path: ${{ runner.temp }}/site

            - name: Publish to GitHub Pages
              run: node .github/scripts/publish-gh-pages.mjs --target . --source "$RUNNER_TEMP/site"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
