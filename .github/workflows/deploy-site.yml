name: Build and Deploy Site to GitHub Pages

on:
    push:
        branches:
            - main
        paths:
            - 'apps/site/**'
            - 'storybook/**'
            - 'packages/**'
            - 'README.md'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.nvmrc'
            - '.github/workflows/deploy-site.yml'
    pull_request:
        paths:
            - 'apps/site/**'
            - 'packages/**'
            - 'README.md'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.nvmrc'
            - '.github/workflows/deploy-site.yml'
    workflow_dispatch:

# Disable permissions for all scopes by default; grant per job below.
permissions: {}

# PR validation does not hold up production deployments. Never cancel a
# deployment that has already started.
concurrency:
    group: pages-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build site
              run: pnpm build:site

            # Visual Regression Test already builds Storybook for PRs.
            - name: Build Storybook
              if: github.event_name != 'pull_request'
              run: pnpm build-storybook

            - name: Assemble Pages artifact
              if: github.event_name != 'pull_request'
              run: node apps/site/scripts/assemble-pages.mjs

            - name: Setup Pages
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload artifact
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/site/dist

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
