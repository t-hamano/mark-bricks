name: Tauri Smoke

on:
    pull_request:
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke.yml'
    push:
        branches:
            - main
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    smoke:
        name: Smoke (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-22.04, macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: ./apps/tauri/src-tauri -> target
                  key: smoke-${{ matrix.platform }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xvfb

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Tauri debug binary
              run: pnpm --filter mark-bricks-desktop build:debug

            - name: Smoke launch
              run: pnpm --filter mark-bricks-desktop e2e:smoke
