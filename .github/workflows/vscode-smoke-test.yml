name: VS Code Smoke Test

on:
    pull_request:
        paths:
            - 'apps/vscode/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/vscode-smoke-test.yml'
    push:
        branches:
            - main
        paths:
            - 'apps/vscode/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/vscode-smoke-test.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    smoke:
        name: Smoke (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build extension
              run: pnpm --filter mark-bricks-vscode build

            - name: Smoke test
              if: runner.os == 'Linux'
              run: xvfb-run -a pnpm --filter mark-bricks-vscode e2e:smoke

            - name: Smoke test
              if: runner.os != 'Linux'
              run: pnpm --filter mark-bricks-vscode e2e:smoke
