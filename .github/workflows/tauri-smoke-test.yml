name: Tauri Smoke Test

on:
    pull_request:
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke-test.yml'
    push:
        branches:
            - main
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke-test.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    smoke:
        name: Smoke (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-22.04, macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
              with:
                  workspaces: ./apps/tauri/src-tauri -> target
                  key: smoke-${{ matrix.platform }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xvfb

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Tauri debug binary
              run: pnpm --filter mark-bricks-desktop build:debug

            - name: Smoke launch
              run: pnpm --filter mark-bricks-desktop e2e:smoke
