name: Tauri Smoke Test

on:
    pull_request:
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke-test.yml'
    push:
        branches:
            - main
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/tauri-smoke-test.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    smoke:
        name: Smoke (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-22.04, macos-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable

            - name: Rust cache
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
              with:
                  workspaces: ./apps/tauri/src-tauri -> target
                  key: smoke-${{ matrix.platform }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xvfb

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Tauri debug binary
              run: pnpm --filter mark-bricks-desktop build:debug

            - name: Smoke launch
              run: pnpm --filter mark-bricks-desktop e2e:smoke
