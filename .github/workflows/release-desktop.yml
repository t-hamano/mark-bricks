name: Release Desktop

on:
    push:
        tags:
            - 'tauri-v[0-9]+.[0-9]+.[0-9]+'
            - 'tauri-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: '--target universal-apple-darwin'
                    - platform: ubuntu-22.04
                      args: ''
                    - platform: windows-latest
                      args: ''

        runs-on: ${{ matrix.platform }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify macOS signing configuration
              if: matrix.platform == 'macos-latest'
              shell: bash
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                    if [[ -z "${!name}" ]]; then
                      echo "::error::Missing required repository secret: $name"
                      exit 1
                    fi
                  done
                  if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
                    echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
                    exit 1
                  fi

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Extract release notes from the changelog
              id: notes
              shell: bash
              run: node .github/scripts/extract-release-notes.mjs apps/tauri/CHANGELOG.md "${GITHUB_REF_NAME#tauri-v}"

            - name: Build and release
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
                  APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
                  APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
              with:
                  projectPath: apps/tauri
                  tagName: ${{ github.ref_name }}
                  releaseName: ${{ github.ref_name }}
                  releaseBody: ${{ steps.notes.outputs.notes }}
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
                  uploadUpdaterSignatures: false

            - name: Verify macOS signature and notarization
              if: matrix.platform == 'macos-latest'
              shell: bash
              run: |
                  app="apps/tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/MarkBricks.app"
                  codesign --verify --deep --strict --verbose=2 "$app"
                  xcrun stapler validate "$app"
                  spctl --assess --type execute --verbose=2 "$app"
