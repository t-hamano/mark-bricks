name: Preview Build

# Builds the app for each platform on every pull request and uploads the
# installers as workflow artifacts. Reviewers download them from the run's
# "Artifacts" section on the Actions page (requires being signed in to GitHub).
#
# The build runs untrusted PR code, so it is kept unprivileged: no secrets, a
# read-only token, and createUpdaterArtifacts disabled so it does not need the
# updater signing key (which is unavailable to fork pull requests anyway).

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'apps/tauri/**'
            - 'packages/editor/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/preview-build.yml'

# Cancel superseded runs for the same PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    build:
        name: Build (${{ matrix.label }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      label: macos
                      args: '--target universal-apple-darwin'
                    - platform: ubuntu-22.04
                      label: linux
                      args: ''
                    - platform: windows-latest
                      label: windows
                      args: ''

        runs-on: ${{ matrix.platform }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
              with:
                  workspaces: ./apps/tauri/src-tauri -> target

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build app
              id: tauri
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
              with:
                  projectPath: apps/tauri
                  args: '${{ matrix.args }} --config {"bundle":{"createUpdaterArtifacts":false}}'

            - name: Collect bundle paths
              id: bundle
              shell: bash
              env:
                  ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
              run: |
                  {
                    echo "paths<<EOF"
                    echo "$ARTIFACT_PATHS" | jq -r '.[]'
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Upload build artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: markbricks-${{ matrix.label }}
                  path: ${{ steps.bundle.outputs.paths }}
                  if-no-files-found: error
