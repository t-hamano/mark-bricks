name: Release VSCode Extension

on:
    push:
        tags:
            - 'vscode-v[0-9]+.[0-9]+.[0-9]+'

permissions:
    contents: write
    # Lets azure/login exchange a GitHub OIDC token for the managed identity
    # that is a member of the Marketplace publisher.
    id-token: write

jobs:
    release:
        name: Build and release
        runs-on: ubuntu-latest
        # The managed identity's federated credential trusts only this environment.
        environment: marketplace
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Package the extension
              run: pnpm --filter mark-bricks-vscode run package

            - name: Extract release notes from the changelog
              id: notes
              run: node .github/scripts/extract-release-notes.mjs apps/vscode/CHANGELOG.md "${GITHUB_REF_NAME#vscode-v}"

            - name: Sign in to Azure as the publishing identity
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  allow-no-subscriptions: true

            - name: Publish to the VSCode Marketplace
              working-directory: apps/vscode
              run: pnpm exec vsce publish --azure-credential --packagePath *.vsix

            - name: Create release and upload the .vsix
              env:
                  NOTES: ${{ steps.notes.outputs.notes }}
              run: |
                  gh release create "$GITHUB_REF_NAME" apps/vscode/*.vsix \
                    --title "$GITHUB_REF_NAME" \
                    --notes "$NOTES"
